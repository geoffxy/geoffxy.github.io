---
title: Articles
layout: main
---
<div class="post index">
    <h1>Articles</h1>
    <p class="post-content">
      This is a compact list of all the posts I've written on this website, ordered by newest to oldest.
      Click on any of the titles to read the entire post.
    </p>
    <div class="post-listing-wrap">
        {% for post in site.posts %}
        <div class="post-listing">
            <a href="{{ post.url }}">{{ post.title }}</a>
            <p class="post-date">{{ post.date | date: "%B %e, %Y" }}</p>
        </div>
        {% endfor %}
    </div>
</div>
